[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oud"
version = "0.5.0a1"
description = "Curses lute tablature editor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "frnm"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skrepka-pomoshnik/oud"
Repository = "https://github.com/skrepka-pomoshnik/oud"
Issues = "https://github.com/skrepka-pomoshnik/oud/issues"

[project.scripts]
oud = "oud.presentation.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16.7",
  "ty",
]

[tool.pytest.ini_options]
addopts = "--cov=petrucci"
pythonpath = ["."]
markers = [
  "ft3_corpus: needs the local Gerbode FT3 corpus; skipped when it is missing",
  "tab_program: needs the original tab program in TAB_PROGRAM; skipped when it is unset",
  "musicxml_schema: needs xmllint and MUSICXML_SCHEMA_DIR (the W3C schema folder); skipped when unset",
]

[tool.coverage.run]
branch = false
source = ["petrucci"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
# Fully covered modules are omitted to keep CI logs short; no tests are skipped.
skip_covered = true

[tool.ty]
environment.python-version = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "C90",
  "E",
  "F",
  "I",
  "B",
  "C4",
  "ERA",
  "A",
  "ARG",
  "COM",
  "DTZ",
  "FBT",
  "G",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "S",
  "PL",
  "RUF",
  "RET",
  "TID",
  "TRY",
  "UP",
  "SIM",
]
ignore = [
  "COM812", # Conflicts with Ruff's formatter; retain the rest of the COM rules.
  "FBT",
  "PLR0913",
  "PLR0915",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101", "PLR2004"]

[tool.ruff.lint.mccabe]
# The ceiling is enforced for new code. Exact legacy C901 findings and their
# enforced directly by the architecture quality check.
max-complexity = 7

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.setuptools.packages.find]
include = ["oud*", "petrucci*"]
exclude = ["refs*", "downloads*", "examples*", "tests*"]

[tool.setuptools.package-data]
oud = ["py.typed"]
petrucci = ["py.typed"]
