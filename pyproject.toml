[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oud"
version = "0.1.0a1"
description = "Curses lute tablature editor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "frnm"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skrepka-pomoshnik/oud"
Repository = "https://github.com/skrepka-pomoshnik/oud"
Issues = "https://github.com/skrepka-pomoshnik/oud/issues"

[project.scripts]
oud = "oud.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["oud*"]
exclude = ["refs*", "downloads*", "lutemusic*", "examples*", "tests*"]
