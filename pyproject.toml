[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oud"
version = "0.4.0a1"
description = "Curses lute tablature editor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "frnm"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skrepka-pomoshnik/oud"
Repository = "https://github.com/skrepka-pomoshnik/oud"
Issues = "https://github.com/skrepka-pomoshnik/oud/issues"

[project.scripts]
oud = "oud.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16",
  "ty",
]

[tool.pytest.ini_options]
addopts = "-n 4 --dist loadscope"
pythonpath = ["."]

[tool.ty]
environment.python-version = "3.11"

[tool.setuptools.packages.find]
include = ["oud*", "petrucci*"]
exclude = ["refs*", "downloads*", "lutemusic*", "examples*", "tests*"]

[tool.setuptools.package-data]
oud = ["py.typed"]
petrucci = ["py.typed"]
