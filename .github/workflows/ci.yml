name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Fetch fixed external FT3 corpora
        run: >-
          uv run python scripts/fetch_ft3_corpus.py
          corpus/ft3-regression.json
          corpus/ft3-random-75.json
      - name: Quality gate
        run: ./scripts/quality.sh
