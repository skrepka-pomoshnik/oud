name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Fetch fixed external FT3 corpora
        run: >-
          uv run python scripts/fetch_ft3_corpus.py
          corpus/ft3-regression.json
          corpus/ft3-random-75.json
          corpus/ft3-random-75-v2.json
          corpus/ft3-random-50-v3.json
          corpus/ft3-random-63-v4.json
          corpus/ft3-note-input-100.json
      - name: Quality gate
        run: ./scripts/quality.sh
