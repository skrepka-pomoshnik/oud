line-length = 120
target-version = "py311"

[lint]
select = [
  "C90",
  "E",
  "F",
  "I",
  "B",
  "C4",
  "ERA",
  "A",
  "ARG",
  "COM",
  "DTZ",
  "FBT",
  "G",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "S",
  "PL",
  "RUF",
  "RET",
  "TID",
  "TRY",
  "UP",
  "SIM",
]
ignore = [
  "COM812", # Conflicts with Ruff's formatter; retain the rest of the COM rules.
  "FBT",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "S101",
]

[lint.per-file-ignores]
"tests/*" = ["E501", "S101", "PLR2004"]

[lint.mccabe]
# The ceiling is enforced for new code. Exact legacy C901 findings and their
# retirement targets are tracked by architecture-debt.json and TODO.md.
max-complexity = 7

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
